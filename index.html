<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Villa Ledger — Owner Portal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&display=swap');

  :root{
    --paper:#F7F3EA;
    --paper-raised:#FFFDF8;
    --ink:#20281F;
    --ink-soft:#5B6355;
    --rule:#D9D0BC;
    --clay:#B8531F;
    --clay-deep:#8F3E15;
    --sage:#5F7A5A;
    --sage-soft:#E4EBDF;
    --brick:#8C3A34;
    --brick-soft:#F3E0DD;
    --stamp-ink:#20281F;
    --shadow: 0 1px 0 rgba(32,40,31,0.06), 0 8px 24px -12px rgba(32,40,31,0.25);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, rgba(184,83,31,0.05), transparent 45%),
      var(--paper);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Source Sans 3', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      repeating-linear-gradient(rgba(32,40,31,0.018) 0 1px, transparent 1px 28px);
    pointer-events:none;
    z-index:0;
  }

  .wrap{position:relative; z-index:1; max-width:920px; margin:0 auto; padding:32px 20px 80px;}

  /* ---------- header ---------- */
  .masthead{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px; margin-bottom:28px;
    flex-wrap:wrap; gap:10px;
  }
  .masthead h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-optical-sizing:auto;
    font-size:clamp(26px,4vw,34px);
    letter-spacing:-0.01em;
    margin:0;
  }
  .masthead .tag{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .owner-chip{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    display:flex; align-items:center; gap:10px;
    color:var(--ink-soft);
  }
  .owner-chip button{
    background:none; border:1px solid var(--rule); color:var(--ink-soft);
    font-family:'JetBrains Mono', monospace; font-size:11px;
    padding:5px 10px; border-radius:3px; cursor:pointer;
  }
  .owner-chip button:hover{border-color:var(--ink); color:var(--ink);}

  /* ---------- login card ---------- */
  #login-view{
    max-width:420px; margin:60px auto 0;
    background:var(--paper-raised);
    border:1px solid var(--rule);
    box-shadow:var(--shadow);
    padding:40px 36px;
    position:relative;
  }
  #login-view::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:4px;
    background:linear-gradient(90deg, var(--clay), var(--sage));
  }
  #login-view h2{
    font-family:'Fraunces', serif; font-weight:600; font-size:22px;
    margin:0 0 6px;
  }
  #login-view p.sub{
    color:var(--ink-soft); font-size:14px; margin:0 0 26px; line-height:1.5;
  }
  .field-label{
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--ink-soft); display:block; margin-bottom:8px;
  }
  input[type="tel"], input[type="text"], input[type="date"], input[type="time"], select{
    width:100%;
    font-family:'JetBrains Mono', monospace;
    font-size:16px;
    padding:12px 14px;
    border:1.5px solid var(--rule);
    background:var(--paper);
    color:var(--ink);
    border-radius:2px;
    outline:none;
  }
  input:focus, select:focus{border-color:var(--clay);}
  .btn{
    font-family:'JetBrains Mono', monospace;
    font-size:13px; letter-spacing:0.04em; text-transform:uppercase;
    padding:13px 20px;
    border:none; border-radius:2px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--clay); color:#fff; width:100%; margin-top:22px;}
  .btn-primary:hover{background:var(--clay-deep);}
  .btn-ghost{background:transparent; border:1.5px solid var(--ink); color:var(--ink);}
  .btn-ghost:hover{background:var(--ink); color:var(--paper);}
  .btn-sage{background:var(--sage); color:#fff;}
  .btn-brick{background:var(--brick); color:#fff;}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}

  #login-error{
    color:var(--brick); font-size:13px; margin-top:14px; display:none;
    font-family:'JetBrains Mono', monospace;
  }
  .spinner{
    display:inline-block; width:14px; height:14px;
    border:2px solid rgba(255,255,255,0.4); border-top-color:#fff;
    border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; margin-right:8px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- portal view ---------- */
  #portal-view{display:none;}

  .booking-panel{background:var(--paper-raised);border:1px solid var(--rule);box-shadow:var(--shadow);padding:18px;margin:0 0 22px}.booking-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.booking-kicker{font:9px 'JetBrains Mono',monospace;letter-spacing:.14em;color:var(--ink-soft)}.booking-head h3{font-family:'Fraunces',serif;font-size:20px;margin:3px 0}.booking-count{font:11px 'JetBrains Mono',monospace;border:1px solid var(--rule);border-radius:14px;padding:6px 9px}.booking-list{display:grid;gap:8px}.booking-card{border:1px solid var(--rule);background:var(--paper);padding:12px}.booking-card-top{display:flex;justify-content:space-between;gap:10px}.booking-property{font:600 17px 'Fraunces',serif}.booking-status{font:9px 'JetBrains Mono',monospace;padding:4px 7px;border:1px solid var(--sage);color:var(--sage);background:var(--sage-soft)}.booking-status.cancelled,.booking-status.pending{border-color:var(--brick);color:var(--brick);background:var(--brick-soft)}.booking-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px;margin-top:8px;font:10px 'JetBrains Mono',monospace;color:var(--ink-soft)}.booking-meta b{color:var(--ink);font-weight:500}.booking-slots{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.booking-slot{font:9px 'JetBrains Mono',monospace;padding:4px 6px;border:1px solid var(--brick);background:var(--brick-soft);color:var(--brick)}.calendar-booking{margin-top:3px;padding:4px 5px;border-left:3px solid var(--brick);background:var(--brick-soft);color:var(--brick);font:8.5px/1.3 'JetBrains Mono',monospace}.calendar-booking strong{font-weight:600}
  .prop-select-row{
    display:flex; gap:10px; flex-wrap:wrap; margin-bottom:26px;
  }
  .prop-pill{
    font-family:'JetBrains Mono', monospace; font-size:12px;
    padding:9px 14px; border:1.5px solid var(--rule); border-radius:20px;
    cursor:pointer; background:var(--paper-raised); color:var(--ink-soft);
  }
  .prop-pill.active{border-color:var(--clay); color:var(--clay-deep); background:#FBEEE4; font-weight:600;}

  .cal-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px;
  }
  .cal-header h2{
    font-family:'Fraunces', serif; font-weight:600; font-size:24px; margin:0;
  }
  .cal-nav{display:flex; gap:8px; align-items:center;}
  .cal-nav button{
    width:34px; height:34px; border-radius:50%;
    border:1.5px solid var(--ink); background:transparent;
    font-family:'JetBrains Mono', monospace; font-size:15px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .cal-nav button:hover{background:var(--ink); color:var(--paper);}

  .legend{display:flex; gap:18px; margin-bottom:16px; flex-wrap:wrap;}
  .legend span{
    font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-soft);
    display:flex; align-items:center; gap:6px;
  }
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block;}
  .dot.avail{background:var(--sage);}
  .dot.blocked{background:var(--brick);}
  .dot.empty{background:var(--rule);}

  .cal-grid{
    display:grid; grid-template-columns:repeat(7,1fr);
    gap:6px;
    background:var(--rule);
    padding:1px;
    border:1px solid var(--rule);
  }
  .cal-dow{
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--ink-soft); text-align:center;
    padding:6px 0; background:var(--paper);
  }
  .cal-cell{
    background:var(--paper-raised);
    min-height:78px;
    padding:8px 8px 6px;
    cursor:pointer;
    position:relative;
    display:flex; flex-direction:column; gap:4px;
    transition:background .1s ease;
  }
  .cal-cell:hover{background:#FBF7EE;}
  .cal-cell.pad{background:var(--paper); cursor:default;}
  .cal-cell.pad:hover{background:var(--paper);}
  .cal-cell .daynum{
    font-family:'Fraunces', serif; font-size:15px; font-weight:600; color:var(--ink);
  }
  .cal-cell.today .daynum{
    background:var(--ink); color:var(--paper);
    width:22px; height:22px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:12px;
  }
  .stamp{
    font-family:'JetBrains Mono', monospace; font-size:9.5px;
    padding:2px 5px; border-radius:2px;
    display:inline-block; width:fit-content;
    transform:rotate(-1.2deg);
    letter-spacing:0.02em;
  }
  .stamp.avail{background:var(--sage-soft); color:var(--sage); border:1px solid var(--sage);}
  .stamp.blocked{background:var(--brick-soft); color:var(--brick); border:1px solid var(--brick);}
  .cell-times{font-family:'JetBrains Mono', monospace; font-size:9px; color:var(--ink-soft); line-height:1.35;}

  /* ---------- modal ---------- */
  .modal-backdrop{
    display:none; position:fixed; inset:0; background:rgba(32,40,31,0.45);
    align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal-backdrop.open{display:flex;}
  .modal{
    background:var(--paper-raised); border:1px solid var(--rule);
    max-width:420px; width:100%; padding:30px 28px;
    box-shadow:var(--shadow); position:relative;
  }
  .modal h3{
    font-family:'Fraunces', serif; font-weight:600; font-size:20px; margin:0 0 4px;
  }
  .modal .modal-date{
    font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--ink-soft); margin-bottom:20px;
  }
  .modal-close{
    position:absolute; top:18px; right:18px; background:none; border:none;
    font-size:20px; cursor:pointer; color:var(--ink-soft); line-height:1;
  }
  .status-toggle{display:flex; gap:8px; margin-bottom:18px;}
  .status-toggle button{
    flex:1; padding:11px; border:1.5px solid var(--rule); background:var(--paper);
    font-family:'JetBrains Mono', monospace; font-size:12px; cursor:pointer; border-radius:2px;
  }
  .status-toggle button.sel-avail.active{border-color:var(--sage); background:var(--sage-soft); color:var(--sage); font-weight:600;}
  .status-toggle button.sel-blocked.active{border-color:var(--brick); background:var(--brick-soft); color:var(--brick); font-weight:600;}

  .time-row{display:flex; gap:10px; margin-bottom:8px;}
  .time-row .field{flex:1;}
  .time-list{margin-bottom:16px;}
  .time-list-item{
    display:flex; align-items:center; justify-content:space-between;
    font-family:'JetBrains Mono', monospace; font-size:12px;
    padding:8px 10px; background:var(--sage-soft); border-radius:2px; margin-bottom:6px;
  }
  .time-list-item button{background:none; border:none; color:var(--brick); cursor:pointer; font-size:14px;}
  .add-slot-row{display:flex; gap:8px; margin-bottom:18px;}
  .add-slot-row button{
    background:var(--ink); color:var(--paper); border:none; border-radius:2px;
    padding:0 14px; font-family:'JetBrains Mono', monospace; font-size:13px; cursor:pointer;
  }
  .modal-actions{display:flex; gap:10px; margin-top:6px;}
  #refresh-btn{
    background:transparent; color:var(--ink); border:1px solid var(--rule);
    border-radius:2px; padding:7px 10px; font-family:'JetBrains Mono',monospace;
    font-size:11px; cursor:pointer; white-space:nowrap;
  }
  #refresh-btn:hover{background:var(--paper);}
  #refresh-btn:disabled{opacity:.55; cursor:wait;}
  .modal-error{
    display:none; margin:0 0 14px; padding:10px 12px;
    border:1px solid var(--brick); background:var(--brick-soft); color:var(--brick);
    font-family:'JetBrains Mono',monospace; font-size:11px; line-height:1.45;
  }
  .modal-error.show{display:block;}

  .modal-actions .btn{flex:1;}

  .empty-note{
    font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--ink-soft);
    text-align:center; padding:40px 20px; border:1px dashed var(--rule); margin-top:20px;
  }
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--paper); font-family:'JetBrains Mono', monospace;
    font-size:12px; padding:12px 20px; border-radius:3px; opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease; z-index:100;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:520px){
    .cal-cell{min-height:64px; padding:6px 6px 4px;}
    .stamp{font-size:8.5px;}
    #login-view{padding:30px 22px;}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="masthead">
    <div>
      <h1>Villa Ledger</h1>
      <div class="tag">Owner Availability Portal</div>
    </div>
    <div class="owner-chip" id="owner-chip" style="display:none;">
      <span id="owner-chip-text"></span>
      <button id="refresh-btn" type="button" title="Refresh availability">↻ Refresh</button>
      <button id="logout-btn">Log out</button>
    </div>
  </div>

  <!-- LOGIN -->
  <div id="login-view">
    <h2>Enter your number</h2>
    <p class="sub">No password — just the phone number linked to your property listing.</p>
    <label class="field-label" for="phone-input">Phone number</label>
    <input type="tel" id="phone-input" placeholder="9941968238" inputmode="numeric" autocomplete="tel">
    <button class="btn btn-primary" id="login-btn">Open my calendar</button>
    <div id="login-error"></div>
  </div>

  <!-- PORTAL -->
  <div id="portal-view">
    <div class="prop-select-row" id="prop-select-row"></div>

    <section class="booking-panel" id="booking-panel"><div class="booking-head"><div><div class="booking-kicker">BOOKINGS</div><h3>Upcoming & recent bookings</h3></div><span class="booking-count" id="booking-count">0</span></div><div class="booking-list" id="booking-list"><div class="empty-note">No bookings found for this property.</div></div></section>

    <div class="cal-header">
      <h2 id="cal-month-label"></h2>
      <div class="cal-nav">
        <button id="cal-prev">&larr;</button>
        <button id="cal-today">Today</button>
        <button id="cal-next">&rarr;</button>
      </div>
    </div>

    <div class="legend">
      <span><span class="dot avail"></span> Available</span>
      <span><span class="dot blocked"></span> Blocked</span>
      <span><span class="dot empty"></span> Not set — tap to add</span>
    </div>

    <div class="cal-grid" id="cal-dow-row"></div>
    <div class="cal-grid" id="cal-grid" style="margin-top:6px;"></div>
  </div>
</div>

<!-- Day edit modal -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <button class="modal-close" id="modal-close">&times;</button>
    <h3>Update availability</h3>
    <div class="modal-date" id="modal-date"></div>

    <div class="status-toggle">
      <button class="sel-avail" id="toggle-avail">Available</button>
      <button class="sel-blocked" id="toggle-blocked">Blocked / booked</button>
    </div>

    <div id="modal-error" class="modal-error" role="alert" aria-live="polite"></div>

      <div id="avail-fields">
      <label class="field-label">Time windows</label>
      <div class="time-list" id="time-list"></div>
      <div class="add-slot-row">
        <div class="field"><input type="time" id="new-start" value="10:00"></div>
        <div class="field"><input type="time" id="new-end" value="18:00"></div>
        <button id="add-time-btn">Add</button>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="modal-save" style="margin-top:0;">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIG — point this at your n8n instance's webhook base URL
   ============================================================ */
const API_BASE = "https://tempmailnvc4wrd32.app.n8n.cloud/webhook";

/* ---------------- state ---------------- */
let state = {
  phone: null,
  ownerName: '',
  properties: [],
  slots: [],
  bookings: [],
  activePropertyId: null,
  viewYear: new Date().getFullYear(),
  viewMonth: new Date().getMonth(), // 0-indexed
  modalDate: null,
  modalStatus: 'available',
  modalTimes: []
};

const $ = sel => document.querySelector(sel);
const todayISO = () => new Date().toISOString().slice(0,10);

/* ---------------- toast ---------------- */
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

/* ---------------- login ---------------- */
$('#login-btn').addEventListener('click', doLogin);
$('#phone-input').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

async function doLogin(){
  const raw = $('#phone-input').value.trim();
  const phone = raw.replace(/\D/g,'');
  const errEl = $('#login-error');
  errEl.style.display = 'none';
  if (phone.length < 6){
    errEl.textContent = 'Enter a valid phone number.';
    errEl.style.display = 'block';
    return;
  }
  const btn = $('#login-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Checking…';
  try{
    const data = await callAPI('/owner-portal/login', { phone });
    if (!data.success){
      errEl.textContent = data.error || 'No properties found for this number.';
      errEl.style.display = 'block';
      return;
    }
    state.phone = phone;
    state.ownerName = data.owner_name || '';

    // Normalize n8n response: the workflow may return duplicate items.
    // Keep one property per property_id and one slot per slot_id/composite key.
    const rawProperties = Array.isArray(data.properties) ? data.properties : [];
    const propertyMap = new Map();
    rawProperties.forEach(p => {
      if (!p) return;
      const id = p.property_id ?? p.id;
      if (id == null) return;
      if (!propertyMap.has(String(id))) {
        propertyMap.set(String(id), { ...p, property_id: id });
      }
    });
    state.properties = [...propertyMap.values()];

    const rawSlots = Array.isArray(data.slots) ? data.slots : [];
    const slotMap = new Map();
    rawSlots.forEach(s => {
      if (!s) return;
      const key = s.slot_id != null
        ? `id:${s.slot_id}`
        : `slot:${s.property_id}|${s.date}|${s.start_time || ''}|${s.end_time || ''}|${s.status || ''}`;
      if (!slotMap.has(key)) slotMap.set(key, s);
    });
    state.slots = dedupeSlots([...slotMap.values()]);
    state.bookings = normalizeBookings(data.bookings);

    state.activePropertyId = state.properties[0]?.property_id || null;

    localStorage.setItem('villa_owner_phone', phone);

    enterPortal();
  }catch(err){
    console.error('Owner portal login failed:', err);
    errEl.textContent = err?.message || 'Could not reach the server. Check your connection and try again.';
    errEl.style.display = 'block';
  }finally{
    btn.disabled = false;
    btn.textContent = 'Open my calendar';
  }
}

$('#logout-btn').addEventListener('click', () => {
  localStorage.removeItem('villa_owner_phone');
  state.phone = null;
  $('#portal-view').style.display = 'none';
  $('#owner-chip').style.display = 'none';
  $('#login-view').style.display = 'block';
  $('#phone-input').value = '';
});

function enterPortal(){
  $('#login-view').style.display = 'none';
  $('#portal-view').style.display = 'block';
  $('#owner-chip').style.display = 'flex';
  $('#owner-chip-text').textContent = state.ownerName ? `${state.ownerName} · ${state.phone}` : state.phone;
  renderPropertyPills();
  renderCalendar();
}

/* ---------------- property pills ---------------- */
function renderPropertyPills(){
  const row = $('#prop-select-row');
  row.innerHTML = '';
  state.properties.forEach(p => {
    const pill = document.createElement('button');
    pill.className = 'prop-pill' + (p.property_id === state.activePropertyId ? ' active' : '');
    pill.textContent = p.property_name || p.property_id;
    pill.addEventListener('click', () => {
      state.activePropertyId = p.property_id;
      renderPropertyPills();
      renderCalendar();
    });
    row.appendChild(pill);
  });
}

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normalizeBookings(bs){const seen=new Set(),out=[];for(const b of Array.isArray(bs)?bs:[]){const x={...b,booking_id:String(b.booking_id??b.id??b['Booking ID']??''),property_id:String(b.property_id??b['Property ID']??''),property_name:b.property_name??b['Property Name']??'',customer_name:b.customer_name??b['Customer Name']??b.name??'',customer_phone:b.customer_phone??b['Customer Phone']??b.phone??'',check_in:normalizeDateValue(b.check_in??b['Check-in']??''),check_out:normalizeDateValue(b.check_out??b['Check-out']??''),status:String(b.status??b['Booking Status']??'confirmed').toLowerCase(),preferred_time:b.preferred_time??b['Preferred Time']??'',guests:b.guests??b.Guests??'',booked_slots:Array.isArray(b.booked_slots)?b.booked_slots:Array.isArray(b.slots)?b.slots:[]};const k=x.booking_id||`${x.property_id}|${x.check_in}|${x.check_out}|${x.customer_phone}`;if(!seen.has(k)){seen.add(k);out.push(x)}}return out}
function bookingDates(b){const a=[];if(!b.check_in)return a;const end=b.check_out||b.check_in,d=new Date(b.check_in+'T00:00:00Z'),e=new Date(end+'T00:00:00Z');if(isNaN(d)||isNaN(e))return a;for(;d<e;d.setUTCDate(d.getUTCDate()+1))a.push(d.toISOString().slice(0,10));if(!a.length)a.push(b.check_in);return a}
function activeBookings(){return state.bookings.filter(b=>!b.property_id||String(b.property_id)===String(state.activePropertyId))}
function renderBookings(){const el=$('#booking-list'),count=$('#booking-count');if(!el)return;const bs=activeBookings().sort((a,b)=>String(a.check_in).localeCompare(String(b.check_in)));count.textContent=bs.length;if(!bs.length){el.innerHTML='<div class="empty-note">No bookings found for this property.</div>';return}el.innerHTML=bs.map(b=>{const st=['cancelled','pending'].includes(b.status)?b.status:'confirmed';const slots=b.booked_slots.map(x=>`<span class="booking-slot">${esc(normalizeDateValue(x.date))}${x.start_time&&x.end_time?' · '+esc(normalizeTimeValue(x.start_time))+'–'+esc(normalizeTimeValue(x.end_time)):''}</span>`).join('');return `<div class="booking-card"><div class="booking-card-top"><div class="booking-property">${esc(b.property_name||'Booking')}</div><span class="booking-status ${st}">${esc(st.toUpperCase())}</span></div><div class="booking-meta"><span>Guest <b>${esc(b.customer_name||b.customer_phone||'—')}</b></span><span>Phone <b>${esc(b.customer_phone||'—')}</b></span><span>Dates <b>${esc(b.check_in||'—')} → ${esc(b.check_out||'—')}</b></span><span>Guests <b>${esc(b.guests||'—')}</b></span><span>Time <b>${esc(b.preferred_time||'—')}</b></span><span>Booking <b>${esc(b.booking_id||'—')}</b></span></div>${slots?'<div class="booking-slots">'+slots+'</div>':''}</div>`}).join('')}
function bookingsForDate(date){return activeBookings().filter(b=>bookingDates(b).includes(date))}

/* ---------------- calendar rendering ---------------- */
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

$('#cal-prev').addEventListener('click', () => shiftMonth(-1));
$('#cal-next').addEventListener('click', () => shiftMonth(1));
$('#cal-today').addEventListener('click', () => {
  const n = new Date();
  state.viewYear = n.getFullYear();
  state.viewMonth = n.getMonth();
  renderCalendar();
});
function shiftMonth(delta){
  state.viewMonth += delta;
  if (state.viewMonth < 0){ state.viewMonth = 11; state.viewYear--; }
  if (state.viewMonth > 11){ state.viewMonth = 0; state.viewYear++; }
  renderCalendar();
}

function normalizeTimeValue(v){
  const s = String(v || '').trim();
  const m = s.match(/^(\d{1,2}):(\d{2})/);
  return m ? `${m[1].padStart(2,'0')}:${m[2]}` : '';
}
function normalizeDateValue(v){ return String(v || '').trim().slice(0,10); }
function slotTimeKey(s){
  return `${String(s.property_id || '')}|${normalizeDateValue(s.date)}|${normalizeTimeValue(s.start_time)}|${normalizeTimeValue(s.end_time)}`;
}
function dedupeSlots(slots){
  const out = [], seen = new Set();
  for (const s of (slots || [])){
    if (!s) continue;
    const item = {...s,
      property_id:String(s.property_id || ''),
      date:normalizeDateValue(s.date),
      start_time:normalizeTimeValue(s.start_time),
      end_time:normalizeTimeValue(s.end_time),
      status:String(s.status || '').toLowerCase()
    };
    const key = slotTimeKey(item);
    if (item.start_time && item.end_time && seen.has(key)) continue;
    if (item.start_time && item.end_time) seen.add(key);
    out.push(item);
  }
  return out;
}
function slotsForDate(dateISO){
  return dedupeSlots(state.slots.filter(s =>
    String(s.property_id) === String(state.activePropertyId) &&
    normalizeDateValue(s.date) === normalizeDateValue(dateISO)
  ));
}

function renderCalendar(){
  renderBookings();
  $('#cal-month-label').textContent = `${MONTHS[state.viewMonth]} ${state.viewYear}`;

  const dowRow = $('#cal-dow-row');
  dowRow.innerHTML = '';
  DOW.forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-dow';
    el.textContent = d;
    dowRow.appendChild(el);
  });

  const grid = $('#cal-grid');
  grid.innerHTML = '';

  const firstOfMonth = new Date(state.viewYear, state.viewMonth, 1);
  const startPad = firstOfMonth.getDay();
  const daysInMonth = new Date(state.viewYear, state.viewMonth + 1, 0).getDate();
  const today = todayISO();

  for (let i=0; i<startPad; i++){
    const pad = document.createElement('div');
    pad.className = 'cal-cell pad';
    grid.appendChild(pad);
  }

  for (let day=1; day<=daysInMonth; day++){
    const dateISO = `${state.viewYear}-${String(state.viewMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const cell = document.createElement('div');
    cell.className = 'cal-cell' + (dateISO === today ? ' today' : '');

    const num = document.createElement('div');
    num.className = 'daynum';
    num.textContent = day;
    cell.appendChild(num);

    const dayBookings=bookingsForDate(dateISO);
    dayBookings.slice(0,2).forEach(b=>{const x=document.createElement('div');x.className='calendar-booking';x.innerHTML='<strong>BOOKED</strong> · '+esc(b.customer_name||b.customer_phone||'Booking');cell.appendChild(x)});
    if(dayBookings.length>2){const x=document.createElement('div');x.className='calendar-booking';x.textContent='+'+(dayBookings.length-2)+' more booking';cell.appendChild(x)}
    const daySlots = slotsForDate(dateISO).filter(s => s.status !== 'removed' && s.status !== 'booked');
    if (daySlots.length){
      const hasAvail = daySlots.some(s => s.status === 'available');
      const stamp = document.createElement('div');
      stamp.className = 'stamp ' + (hasAvail ? 'avail' : 'blocked');
      stamp.textContent = hasAvail ? 'OPEN' : 'BLOCKED';
      cell.appendChild(stamp);

      if (hasAvail){
        const times = document.createElement('div');
        times.className = 'cell-times';
        times.innerHTML = daySlots.filter(s=>s.status==='available')
          .map(s => `${s.start_time}–${s.end_time}`).join('<br>');
        cell.appendChild(times);
      }
    }

    cell.addEventListener('click', () => openModal(dateISO));
    grid.appendChild(cell);
  }
}

/* ---------------- modal ---------------- */
function openModal(dateISO){
  if (!state.activePropertyId){ toast('Select a property first.'); return; }
  state.modalDate = dateISO;
  clearModalError();
  const existing = dedupeSlots(slotsForDate(dateISO)).filter(s => s.status !== 'removed');
  const hasAvail = existing.some(s => s.status === 'available');
  state.modalStatus = existing.length === 0 ? 'available' : (hasAvail ? 'available' : 'blocked');
  state.modalTimes = existing.filter(s => s.status === 'available' && s.start_time && s.end_time)
    .map(s => ({ slot_id: s.slot_id, start_time: s.start_time, end_time: s.end_time }));

  $('#modal-date').textContent = new Date(dateISO+'T00:00:00').toLocaleDateString(undefined,{ weekday:'long', year:'numeric', month:'long', day:'numeric' });
  updateStatusToggleUI();
  renderTimeList();
  $('#modal-backdrop').classList.add('open');
}
function closeModal(){ $('#modal-backdrop').classList.remove('open'); }
$('#modal-close').addEventListener('click', closeModal);
$('#modal-cancel').addEventListener('click', closeModal);
$('#modal-backdrop').addEventListener('click', e => { if (e.target.id === 'modal-backdrop') closeModal(); });

$('#toggle-avail').addEventListener('click', () => { state.modalStatus='available'; updateStatusToggleUI(); });
$('#toggle-blocked').addEventListener('click', () => { state.modalStatus='blocked'; updateStatusToggleUI(); });

function updateStatusToggleUI(){
  $('#toggle-avail').classList.toggle('active', state.modalStatus === 'available');
  $('#toggle-blocked').classList.toggle('active', state.modalStatus === 'blocked');
  $('#avail-fields').style.display = state.modalStatus === 'available' ? 'block' : 'none';
}

function renderTimeList(){
  const list = $('#time-list');
  list.innerHTML = '';
  if (state.modalTimes.length === 0){
    const empty = document.createElement('div');
    empty.style.cssText = 'font-family:JetBrains Mono,monospace;font-size:12px;color:var(--ink-soft);padding:8px 2px;';
    empty.textContent = 'No time windows added yet.';
    list.appendChild(empty);
  }
  state.modalTimes.forEach((t, idx) => {
    const row = document.createElement('div');
    row.className = 'time-list-item';
    row.innerHTML = `<span>${t.start_time} – ${t.end_time}</span>`;
    const del = document.createElement('button');
    del.textContent = '✕';
    del.addEventListener('click', () => {
      state.modalTimes.splice(idx,1);
      renderTimeList();
    });
    row.appendChild(del);
    list.appendChild(row);
  });
}

$('#add-time-btn').addEventListener('click', () => {
  clearModalError();
  const start = normalizeTimeValue($('#new-start').value);
  const end = normalizeTimeValue($('#new-end').value);

  if (!start || !end){
    showModalError('Please select both start and end time.');
    return;
  }
  if (start >= end){
    showModalError('Invalid time range. End time must be later than start time.');
    return;
  }

  const mins = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
  const a = mins(start), b = mins(end);

  if (state.modalTimes.some(t =>
      normalizeTimeValue(t.start_time) === start &&
      normalizeTimeValue(t.end_time) === end)){
    showModalError(`Duplicate time window: ${start} – ${end} is already added.`);
    return;
  }

  const overlap = state.modalTimes.find(t => {
    const x = mins(normalizeTimeValue(t.start_time));
    const y = mins(normalizeTimeValue(t.end_time));
    return a < y && b > x;
  });
  if (overlap){
    showModalError(`This overlaps ${normalizeTimeValue(overlap.start_time)} – ${normalizeTimeValue(overlap.end_time)}.`);
    return;
  }

  state.modalTimes.push({start_time:start, end_time:end});
  renderTimeList();
});

function showModalError(message){
  const el = $('#modal-error');
  if (!el) return;
  el.textContent = message;
  el.classList.add('show');
}
function clearModalError(){
  const el = $('#modal-error');
  if (!el) return;
  el.textContent = '';
  el.classList.remove('show');
}
function validateModalBeforeSave(){
  if (state.modalStatus !== 'available') return {ok:true};
  const mins = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
  const seen = new Set();
  const windows = [];
  for (const t of state.modalTimes){
    const s = normalizeTimeValue(t.start_time), e = normalizeTimeValue(t.end_time);
    if (!s || !e) return {ok:false,message:'Every time window needs a start and end time.'};
    if (s >= e) return {ok:false,message:`Invalid time window: ${s} – ${e}.`};
    const key = `${s}|${e}`;
    if (seen.has(key)) return {ok:false,message:`Duplicate time window: ${s} – ${e}. Remove it before saving.`};
    seen.add(key);
    windows.push({a:mins(s),b:mins(e),label:`${s} – ${e}`});
  }
  windows.sort((x,y)=>x.a-y.a);
  for(let i=1;i<windows.length;i++){
    if(windows[i].a < windows[i-1].b)
      return {ok:false,message:`Overlapping time windows: ${windows[i-1].label} and ${windows[i].label}.`};
  }
  return {ok:true};
}

/* ---------------- save / delete ---------------- */
$('#modal-save').addEventListener('click', saveModal);

async function saveModal(){
  const btn = $('#modal-save');
  clearModalError();

  const check = validateModalBeforeSave();
  if (!check.ok){
    showModalError(check.message);
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Saving…';

  try{
    const existing = dedupeSlots(slotsForDate(state.modalDate))
      .filter(s => s.status !== 'removed');
    const keepIds = new Set(state.modalTimes.map(t => String(t.slot_id || '')).filter(Boolean));

    for (const s of existing){
      const keep = state.modalStatus === 'available' && keepIds.has(String(s.slot_id || ''));
      if (!keep){
        const res = await callAPI('/owner-portal/slot/delete', {
          phone:state.phone, property_id:state.activePropertyId, slot_id:s.slot_id
        });
        if (!res || res.success !== true)
          throw new Error(res?.error || 'Could not remove an existing slot.');
      }
    }

    if (state.modalStatus === 'blocked'){
      const res = await callAPI('/owner-portal/slot', {
        phone:state.phone, property_id:state.activePropertyId,
        date:state.modalDate, status:'unavailable'
      });
      if (!res || res.success !== true)
        throw new Error(res?.error || 'Could not save blocked status.');
    } else {
      for (const t of state.modalTimes){
        if (t.slot_id) continue;
        const res = await callAPI('/owner-portal/slot', {
          phone:state.phone, property_id:state.activePropertyId,
          date:state.modalDate,
          start_time:normalizeTimeValue(t.start_time),
          end_time:normalizeTimeValue(t.end_time),
          status:'available'
        });
        if (!res || res.success !== true)
          throw new Error(res?.error || `Could not save ${t.start_time} – ${t.end_time}.`);
      }
    }

    closeModal();
    toast('Availability saved. Refreshing…');
    await refreshPortalData(false);
  }catch(err){
    console.error(err);
    showModalError(err?.message || 'Could not save availability. Please try again.');
    toast('Save failed.');
  }finally{
    btn.disabled = false;
    btn.textContent = 'Save';
  }
}

async function callAPI(path, body, base = API_BASE){
  const url = `${base}${path}`;
  let res = null;
  let lastError = null;

  for (const candidate of [url, url.replace('/webhook/', '/webhook-test/')]){
    try{
      res = await fetch(candidate, {
        method:'POST',
        headers:{'Content-Type':'application/json','Accept':'application/json'},
        body:JSON.stringify(body || {})
      });
      if(res.ok) break;
      lastError = new Error(`HTTP ${res.status}`);
    }catch(e){ lastError=e; }
  }

  if(!res) throw new Error(`Could not reach the server. ${lastError?.message || ''}`.trim());

  const raw = await res.text();
  let data = {};
  try { data = raw ? JSON.parse(raw) : {}; }
  catch(e){ throw new Error(`Server returned an invalid response (${res.status}).`); }

  if(data?.body && typeof data.body === 'object' && !Array.isArray(data.body)) data=data.body;
  if(!res.ok) throw new Error(data?.error || data?.message || `Server request failed (${res.status}).`);
  if(data?.success === false) throw new Error(data.error || data.message || 'The server rejected the request.');
  return data;
}
async function refreshPortalData(showMessage = true){
  if (!state.phone) return;
  const btn = $('#refresh-btn');
  const oldProperty = state.activePropertyId;
  if(btn){ btn.disabled=true; btn.textContent='↻ Refreshing…'; }

  try{
    const data = await callAPI('/owner-portal/login', {phone:state.phone});
    if(!data?.success) throw new Error(data?.error || 'Could not refresh availability.');

    const pm = new Map();
    for(const p of (Array.isArray(data.properties)?data.properties:[])){
      const id = String(p.property_id ?? p.id ?? '');
      if(id && !pm.has(id)) pm.set(id,{...p,property_id:id});
    }
    state.properties = [...pm.values()];
    state.slots = dedupeSlots(Array.isArray(data.slots)?data.slots:[]);
    state.bookings = normalizeBookings(data.bookings);
    state.activePropertyId = state.properties.some(p=>String(p.property_id)===String(oldProperty))
      ? oldProperty : (state.properties[0]?.property_id || null);
    state.ownerName = data.owner_name || state.ownerName;

    renderPropertyPills();
    renderCalendar();
    if(showMessage) toast('Availability refreshed.');
  }catch(err){
    console.error('Refresh failed:',err);
    if(showMessage) toast(err?.message || 'Could not refresh availability.');
    throw err;
  }finally{
    if(btn){ btn.disabled=false; btn.textContent='↻ Refresh'; }
  }
}

$('#refresh-btn').addEventListener('click', async () => {
  try { await refreshPortalData(true); } catch (_) {}
});

/* ---------------- auto-login if remembered ---------------- */
(function tryAutoLogin(){
  const saved = localStorage.getItem('villa_owner_phone');
  if (saved){
    $('#phone-input').value = saved;
    doLogin();
  }
})();

/* ---------- Portal safety / refresh logic ---------- */
let portalRefreshTimer = null;
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && state.phone){
    clearTimeout(portalRefreshTimer);
    portalRefreshTimer = setTimeout(()=>refreshPortalData(false).catch(()=>{}),700);
  }
});
window.addEventListener('focus', () => {
  if(state.phone){
    clearTimeout(portalRefreshTimer);
    portalRefreshTimer = setTimeout(()=>refreshPortalData(false).catch(()=>{}),700);
  }
});
</script>
